; MSScale phase B: 18m AMSBotCharacter capsule-compatible Recast agent.
; WorldScale 10x (docs/WorldScale_10x_Plan.md W5準備): マップ1辺が約MSGO::MSScale(≈9.3264)倍、
; 面積で約87倍になるため、NavMeshのボクセル/タイル設定を拡大しビルド時間・メモリ・タイル数を抑制。
; - CellSize: 75→150。AgentRadius(330uu)に対する比率330/150≈2.2で推奨下限(2以上)を維持しつつ倍化。
; - CellHeight: 旧CellSize比(75:10≈7.5:1)を保つ形で75→150に対応する20へ拡大(未指定=エンジン既定10からの明示化)。
; - TileSizeUU: 150(新CellSize)×64セル/タイル辺=9600。2^nセル数は非同期タイル生成の定石。
; - TilePoolSize: タイル数増加(面積87倍、ただしTileSizeUUも同倍率で拡大するためタイル数自体は概ね現状維持)に対する
;   安全マージンとしてエンジン既定1024から2048へ倍増。
; 実際のNavMeshフルビルド・タイル数・ビルド時間の実測検証はW5実施ウェーブ(エディタ操作)が行う。
[/Script/NavigationSystem.RecastNavMesh]
AgentRadius=330.0
AgentHeight=1650.0
AgentMaxSlope=44.0
AgentMaxStepHeight=330.0
CellSize=150.0
CellHeight=20.0
TileSizeUU=9600.0
TilePoolSize=2048
; WorldScale 10x (W5): 拠点対角ペア(≈10.5km)のA*がエンジン既定2048ノードで
; partial になるため探索ノード上限を拡大。1ノード≈数百バイトのワーストでも
; 128k×~300B≈40MB級の一時メモリで、8.6km四方マップの全対角パスを完走できる。
